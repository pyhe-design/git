[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-dashboard"
version = "0.1.0"
description = "AI OS Dashboard: local control panel for agents, runs, token usage and cost."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The only runtime dependency, and only for the live Anthropic provider.
anthropic = ["anthropic>=1.11,<2"]
dev = ["anthropic>=1.11,<2", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
aios = "aios.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aios = ["static/*"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "S", "PL"]
ignore = ["PLR0913", "PLR2004", "S101", "ANN401", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR"]
