<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ytdj — two-deck console for YouTube</title>
    <meta
      name="description"
      content="Load two YouTube videos, mix them with an equal-power crossfader, and hold them in time with offset sync."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2362e3c6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2362e3c6'/%3E%3C/svg%3E" />
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact.module.js",
          "preact/hooks": "/vendor/preact-hooks.module.js",
          "htm": "/vendor/htm.module.js"
        }
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#deck-a">Skip to deck A</a>
    <div id="app" aria-busy="true">
      <p class="boot">Loading console…</p>
    </div>
    <noscript>
      <p class="boot">
        ytdj controls embedded YouTube players from the browser, so it needs
        JavaScript. Without it, nothing here can play.
      </p>
    </noscript>
    <!-- Announcements for screen readers; the app writes into this. -->
    <p id="live-region" class="sr-only" role="status" aria-live="polite"></p>
  </body>
</html>
