{% extends "base.html" %}
{% block content %}
<h1 class="title">Sider</h1>
{% if pages %}
<div class="columns is-multiline">
  {% for page in pages %}
  <div class="column is-one-third">
    <a class="box page-card" href="/pages/{{ page.slug }}">
      <p class="title is-5">{{ page.title }}</p>
      <p class="subtitle is-7 has-text-grey">Opdateret {{ page.updated_at.strftime('%d-%m-%Y %H:%M') }}</p>
    </a>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="notification is-info is-light">
  Ingen sider endnu. <a href="/pages/new">Opret den første</a>.
</div>
{% endif %}
{% endblock %}
